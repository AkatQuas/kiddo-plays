# migrate-then-serve：同一次发版里先 migrate、再起 api（Compose 版 initContainer）
#
#   db (healthy) → migrate (一次性，exit 0) → api (长期运行，不跑 DDL)
#
# 用法：
#   docker compose up --build
#   curl http://127.0.0.1:18080/readyz

services:
  db:
    image: postgres:16-alpine
    container_name: migrate-then-serve-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - migrate_then_serve_pg:/var/lib/postgresql/data

  migrate:
    build: ./migrator
    image: migrate-then-serve-migrator:local
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    image: migrate-then-serve-api:local
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      APP_VERSION: "0.1.0"
      PORT: "8080"
      # 主服务明确声明：不做 schema migrate
      SKIP_STARTUP_MIGRATE: "1"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  migrate_then_serve_pg:
