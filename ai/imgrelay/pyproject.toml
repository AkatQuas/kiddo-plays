[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imgrelay"
version = "0.1.0"
description = "Multi-pod scheduler that queues image-to-image jobs and dispatches them to an external engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "imgrelay contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "redis>=5",
    "boto3>=1.34",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2"]

[project.scripts]
imgrelay = "imgrelay.api:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["imgrelay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
