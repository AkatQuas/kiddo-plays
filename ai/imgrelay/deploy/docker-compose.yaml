services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"

  engine:
    image: python:3.11-slim
    command: python /opt/imgrelay/mock_engine.py
    volumes:
      - ../examples/mock_engine.py:/opt/imgrelay/mock_engine.py:ro
    ports:
      - "8081:8081"

  imgrelay:
    build:
      context: ..
    environment:
      REDIS_URL: redis://redis:6379/0
      ENGINE_BASE_URL: http://engine:8081
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: imgrelay
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - minio
      - engine
