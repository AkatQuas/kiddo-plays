# =============================================================
# NGINX 配置片段 (Snippets) — 可复用的功能块
# 路径: nginx/snippets/
# =============================================================
#
# 使用方式: 在 location 块中 include snippets/xxx.conf;

# =============================================================
# snippet: cors-headers.conf
# 功能: 跨域资源共享头
# 对应 Kong: cors 插件
# =============================================================
# add_header Access-Control-Allow-Origin  "*";
# add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
# add_header Access-Control-Allow-Headers "DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization";

# =============================================================
# snippet: rate-limit-strict.conf
# 功能: 严格限流 (用于敏感接口)
# =============================================================
# limit_req zone=global_limit burst=5 nodelay;
# limit_conn global_conn 10;

# =============================================================
# snippet: security-headers.conf
# 功能: 安全头
# 对应 Kong: security 插件
# =============================================================
# add_header X-Content-Type-Options    "nosniff" always;
# add_header X-Frame-Options           "DENY" always;
# add_header X-XSS-Protection          "1; mode=block" always;
# add_header Strict-Transport-Security "max-age=31536000" always;

# =============================================================
# snippet: cache-settings.conf
# 功能: 上游响应缓存设置
# =============================================================
# proxy_cache_valid 200 302 10m;
# proxy_cache_valid 404 1m;
# proxy_cache_key "$scheme$request_method$host$request_uri";

# =============================================================
# snippet: proxy-basic.conf
# 功能: 基础 proxy 转发设置
# =============================================================
# proxy_set_header  Host               $host;
# proxy_set_header  X-Real-IP          $remote_addr;
# proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
# proxy_set_header  X-Forwarded-Proto  $scheme;
# proxy_connect_timeout   5s;
# proxy_send_timeout      10s;
# proxy_read_timeout      10s;

# =============================================================
# snippet: log-format.conf
# 功能: 自定义日志字段说明
# =============================================================
# 可用 NGINX 日志变量:
#   $upstream_addr            — 上游服务地址
#   $upstream_status          — 上游响应状态码
#   $upstream_response_time   — 上游响应时间 (秒)
#   $upstream_connect_time    — 连接上游时间 (秒)
#   $request_time             — 总请求处理时间 (秒)
#   $body_bytes_sent          — 响应体大小
#   $http_x_forwarded_for     — 客户端原始 IP
