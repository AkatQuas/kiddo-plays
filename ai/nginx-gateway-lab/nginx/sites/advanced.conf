# =============================================================
# 进阶配置示例 — 灰度发布 / A/B 测试 / 高级负载均衡
# 不会自动加载，需要手动 include 到 gateway.conf 中
# =============================================================
#
# 使用说明:
#   启用灰度发布: upstream 中取消 backup 注释，重启 nginx
#   启用 A/B测试: uncomment location 中的 A/B 测试块

# =============================================================
# 进阶1: 多目标负载均衡 (多个实例)
# 模拟 Kong upstream 多个 targets
# =============================================================
upstream users_upstream_multi {
    # 主版本 (v1) — 80% 流量
    server localhost:3001 weight=8;

    # 新版本 (v2) — 20% 流量 (灰度发布)
    # 需要启动第二个 users 实例在 3004
    # server localhost:3004 weight=2;

    # 熔断设置: max_fails=3 fail_timeout=30s
    # (在 server 行中配置)
    keepalive 32;
}

