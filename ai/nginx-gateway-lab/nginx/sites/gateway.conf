# =============================================================
# 网关 server 配置 — 主入口 (对应 Kong Proxy)
# 监听 8080 端口，所有流量统一入口
# =============================================================
server {
    listen       8080;
    server_name  localhost gateway.local;

    # 字符集
    charset utf-8;

    # =============================================================
    # 访问日志 (记录转发详情)
    # =============================================================
    access_log  logs/gateway-access.log  gateway_log;
    error_log   logs/gateway-error.log  warn;

    # =============================================================
    # 全局插件: 全局限流 + 连接数限制
    # =============================================================

    # 全局限流 (burst=20 允许突发, nodelay 不延迟)
    # 对应 Kong rate-limiting 插件
    limit_req  zone=global_limit  burst=20  nodelay;

    # 连接数限制
    limit_conn  global_conn  30;

    # =============================================================
    # 通用转发头 (proxy 设置)
    # =============================================================
    proxy_set_header  Host               $host;
    proxy_set_header  X-Real-IP          $remote_addr;
    proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header  X-Forwarded-Proto  $scheme;

    # 超时设置
    proxy_connect_timeout   5s;    # 连接上游超时
    proxy_send_timeout      10s;   # 发送数据超时
    proxy_read_timeout      10s;   # 读取响应超时

    # 缓存设置
    proxy_buffering    on;
    proxy_buffer_size  4k;
    proxy_buffers      8 4k;

    # =============================================================
    # 健康检查 — 被动健康检查 (NGINX 原生)
    # =============================================================
    # 通过 upstream 的 max_fails + fail_timeout 实现
    # NGINX Plus 支持主动健康检查 (类似 Kong Health Checks)
    # 这里我们在 snippet 中实现一个主动健康检查端点

    # =============================================================
    # Route 1: 用户服务 (对应 Kong Route: users-route)
    # URL: /api/users/*  →  users-service:3001
    # 特性: strip_path (去掉 /api 前缀)
    # =============================================================
    location /api/users/ {
        # 转发到 users_upstream
        proxy_pass http://users_upstream/;

        # 限流 (路由级别，比全局更严格)
        limit_req  zone=global_limit  burst=20  nodelay;

        # 转发标记
        add_header X-Gateway-Route  "users-route";

        # 熔断: 上游返回 502/504 时尝试下一个
        proxy_next_upstream         error timeout http_502 http_504;
        proxy_next_upstream_tries   3;
    }

    # 精确匹配 /api/users (不包含尾部斜杠)
    location = /api/users {
        proxy_pass http://users_upstream/users;
        add_header X-Gateway-Route  "users-route";
        proxy_next_upstream         error timeout http_502 http_504;
        proxy_next_upstream_tries   3;
    }

    # =============================================================
    # Route 2: 订单服务 (对应 Kong Route: orders-route)
    # URL: /api/orders/*  →  orders-service:3002
    # =============================================================
    location /api/orders/ {
        proxy_pass http://orders_upstream/;

        # 路由级限流（更宽松，因为订单操作较少）
        limit_req  zone=global_limit  burst=10  nodelay;

        add_header X-Gateway-Route  "orders-route";
        proxy_next_upstream         error timeout http_502 http_504;
        proxy_next_upstream_tries   3;
    }

    location = /api/orders {
        proxy_pass http://orders_upstream/orders;
        add_header X-Gateway-Route  "orders-route";
        proxy_next_upstream         error timeout http_502 http_504;
        proxy_next_upstream_tries   3;
    }

    # =============================================================
    # Route 3: 商品服务 (对应 Kong Route: products-route)
    # URL: /api/products/*  →  products-service:3003
    # =============================================================
    location /api/products/ {
        proxy_pass http://products_upstream/;

        add_header X-Gateway-Route  "products-route";
        proxy_next_upstream         error timeout http_502 http_504;
        proxy_next_upstream_tries   3;
    }

    location = /api/products {
        proxy_pass http://products_upstream/products;
        add_header X-Gateway-Route  "products-route";
        proxy_next_upstream         error timeout http_502 http_504;
        proxy_next_upstream_tries   3;
    }

    # =============================================================
    # Route: 聊天测试页面 (静态文件)
    # 浏览器访问 http://localhost:8080/chat.html
    location = /chat.html {
        alias demo/public/chat.html;
    }

    # =============================================================
    # Route 4: 聊天服务 (WebSocket + Socket.IO)
    # 需要 HTTP 升级 + 长连接支持
    location /ws/chat/ {
        proxy_pass http://chat_upstream/ws/chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Gateway-Route "chat-route";
    }

    # HTTP 端点转发 (聊天统计/健康)
    location /chat/ {
        proxy_pass http://chat_upstream/chat/;
        add_header X-Gateway-Route "chat-route";
    }

    # =============================================================
    # Route 5: 网关健康检查 & 状态
    # =============================================================
    location = /health {
        default_type application/json;
        return 200 '{"service":"gateway","status":"UP","nginx_version":"$nginx_version"}';
    }

    location = /gateway/status {
        default_type application/json;
        return 200 '{"service":"gateway","status":"UP","port":8080,"routes":["/api/users","/api/orders","/api/products","/health","/gateway/status"],"upstreams":["users_upstream","orders_upstream","products_upstream"]}';
    }

    # =============================================================
    # 错误页面 (类似 Kong 的默认错误响应)
    # =============================================================
    error_page 404 /error-404.json;
    location = /error-404.json {
        default_type application/json;
        return 404 '{"error":"Not Found","message":"No route configured for this path","service":"gateway"}';
    }

    error_page 502 503 504 /error-502.json;
    location = /error-502.json {
        internal;
        default_type application/json;
        return 502 '{"error":"Bad Gateway","message":"Upstream service unavailable","service":"gateway"}';
    }

    error_page 429 /error-429.json;
    location = /error-429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded","service":"gateway"}';
    }
}
