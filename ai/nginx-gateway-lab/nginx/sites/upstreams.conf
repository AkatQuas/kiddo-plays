# =============================================================
# 上游服务定义 (Upstreams)
# =============================================================

# --- 用户服务 upstream ---
upstream users_upstream {
    # 加权轮询 (默认算法)
    # weight 越高，分配到越多请求
    server localhost:3001 weight=5 max_fails=3 fail_timeout=30s;
    # 备用服务器（当主服务器全部下线时启用）
    # server localhost:3004 backup;

    # 保活连接数
    keepalive 32;
}

# --- 订单服务 upstream ---
upstream orders_upstream {
    server localhost:3002 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --- 商品服务 upstream ---
upstream products_upstream {
    server localhost:3003 weight=5 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --- 聊天服务 upstream (WebSocket) ---
upstream chat_upstream {
    server localhost:3004 max_fails=3 fail_timeout=30s;
    keepalive 32;
}
