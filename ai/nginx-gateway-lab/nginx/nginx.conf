# =============================================================
# NGINX 主配置文件 — API Gateway 学习项目
# 路径: nginx/nginx.conf
# 启动: nginx -c nginx/nginx.conf -p $(pwd)
# =============================================================

# 全局配置
worker_processes  auto;
daemon off;                # 前台运行（配合 npm start 使用）

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
    use kqueue;            # macOS 使用 kqueue
}

http {
    # 基础设置
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =============================================================
    # 日志格式 — 记录转发细节
    # =============================================================
    log_format gateway_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'upstream="$upstream_addr" '
                           'upstream_status="$upstream_status" '
                           'upstream_time="$upstream_response_time" '
                           'request_time="$request_time"';

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # =============================================================
    # 全局限流配置
    # IP 级别限流: 每分钟 60 次
    limit_req_zone  $binary_remote_addr  zone=global_limit:10m  rate=60r/m;

    # 连接数限制: 每个 IP 最多 30 个并发连接
    limit_conn_zone  $binary_remote_addr  zone=global_conn:10m;

    # 上游服务（Upstream）定制日志格式错误提示
    # 如果 upstream 全部挂掉，返回 502
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;

    # =============================================================
    # 导入站点配置
    include sites/*.conf;
}

