[project]
name = "clip-embed"
version = "0.1.0"
description = "CLIP image embedding API service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.45.0",
    "huggingface-hub>=0.26.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0,<2.0.0",
    "tqdm>=4.65.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
clip-embed = "clip_embed.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clip_embed"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
