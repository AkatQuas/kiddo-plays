name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check data_analysis tests scripts
      - run: ruff check data_analysis tests scripts
      - run: pytest tests/ -v --tb=short
        env:
          DATA_ANALYSIS_API_KEYS: test-key-ci