# Deploy voice-manager image (production/demo).

services:
  voice-manager:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    pull_policy: if_not_present
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    ports:
      - "${VOICE_MANAGER_PORT:-36800}:36800"
    environment:
      CONFIG_PATH: ${CONFIG_PATH:-config/config.docker.json}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/voice_manager}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-voices}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      ASR_URL: ${ASR_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      TTS_URL: ${TTS_URL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      LOG_DIR: ${LOG_DIR:-./logs}
    volumes:
      - voice_manager_logs:/app/logs
    restart: unless-stopped

volumes:
  voice_manager_logs:
