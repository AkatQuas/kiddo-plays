<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Menlo', 'Monaco', 'Courier New', monospace;
    }
  </style>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="34" fill="#0f172a" font-size="16" font-weight="700">Voice Manager 服务流程</text>
  <text x="30" y="54" fill="#64748b" font-size="9">FastAPI · MinIO 对象存储 · PostgreSQL · 外部 ASR/TTS</text>

  <!-- Client -->
  <rect x="430" y="78" width="320" height="62" rx="6" fill="#f8fafc"/>
  <rect x="430" y="78" width="320" height="62" rx="6" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="590" y="104" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Client / API Client</text>
  <text x="590" y="124" fill="#64748b" font-size="9" text-anchor="middle">Header: X-UID · REST /v1/voices · /v1/public/voices</text>

  <!-- Voice Manager -->
  <rect x="340" y="188" width="500" height="88" rx="8" fill="#f8fafc"/>
  <rect x="340" y="188" width="500" height="88" rx="8" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="590" y="218" fill="#0f172a" font-size="12" font-weight="600" text-anchor="middle">Voice Manager API</text>
  <text x="590" y="238" fill="#64748b" font-size="9" text-anchor="middle">FastAPI · src/api · services/voices.py</text>
  <text x="590" y="258" fill="#64748b" font-size="9" text-anchor="middle">Middleware: request_id · uid · 公开写操作 admin 白名单</text>

  <!-- Client to API -->
  <path d="M 590 140 L 590 188" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Create flow region -->
  <rect x="40" y="318" width="1100" height="188" rx="12" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="56" y="338" fill="#d97706" font-size="9" font-weight="600">创建音色主路径（POST /v1/voices）</text>

  <!-- Step 1: Validate -->
  <rect x="70" y="360" width="150" height="60" rx="6" fill="#f8fafc"/>
  <rect x="70" y="360" width="150" height="60" rx="6" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="386" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">校验音频</text>
  <text x="145" y="404" fill="#64748b" font-size="9" text-anchor="middle">audio_utils</text>

  <!-- Step 2: ASR -->
  <rect x="260" y="360" width="150" height="60" rx="6" fill="#f8fafc"/>
  <rect x="260" y="360" width="150" height="60" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="335" y="386" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">ASR 识别</text>
  <text x="335" y="404" fill="#64748b" font-size="9" text-anchor="middle">可选 · 外部服务</text>

  <!-- Step 3: MinIO -->
  <rect x="450" y="360" width="170" height="60" rx="6" fill="#f8fafc"/>
  <rect x="450" y="360" width="170" height="60" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="535" y="386" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">写入 MinIO</text>
  <text x="535" y="404" fill="#64748b" font-size="9" text-anchor="middle">s3://voices/... · file_utils</text>

  <!-- Step 4: PostgreSQL -->
  <rect x="660" y="360" width="170" height="60" rx="6" fill="#f8fafc"/>
  <rect x="660" y="360" width="170" height="60" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="745" y="386" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">写入 PostgreSQL</text>
  <text x="745" y="404" fill="#64748b" font-size="9" text-anchor="middle">voice_meta · voice_model</text>

  <!-- Step 5: TTS -->
  <rect x="870" y="360" width="150" height="60" rx="6" fill="#f8fafc"/>
  <rect x="870" y="360" width="150" height="60" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="945" y="386" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">TTS 示例</text>
  <text x="945" y="404" fill="#64748b" font-size="9" text-anchor="middle">可选 · 外部服务</text>

  <!-- Create flow arrows -->
  <path d="M 220 390 L 260 390" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 410 390 L 450 390" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 620 390 L 660 390" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <path d="M 830 390 L 870 390" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API to validate -->
  <path d="M 590 276 L 590 310 L 145 310 L 145 360" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Query / Delete region -->
  <rect x="40" y="540" width="1100" height="150" rx="12" fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="56" y="560" fill="#0891b2" font-size="9" font-weight="600">查询 / 删除路径</text>

  <!-- Query -->
  <rect x="90" y="590" width="220" height="60" rx="6" fill="#f8fafc"/>
  <rect x="90" y="590" width="220" height="60" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="616" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">GET list / POST get</text>
  <text x="200" y="634" fill="#64748b" font-size="9" text-anchor="middle">读 PostgreSQL 返回元数据</text>

  <!-- Query result -->
  <rect x="380" y="590" width="260" height="60" rx="6" fill="#f8fafc"/>
  <rect x="380" y="590" width="260" height="60" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="510" y="616" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">voice_path</text>
  <text x="510" y="634" fill="#64748b" font-size="9" text-anchor="middle">s3://bucket/voices/&lt;uuid&gt;.wav</text>

  <!-- Delete -->
  <rect x="720" y="590" width="220" height="60" rx="6" fill="#f8fafc"/>
  <rect x="720" y="590" width="220" height="60" rx="6" fill="rgba(225,29,72,0.12)" stroke="#e11d48" stroke-width="1.5"/>
  <text x="830" y="616" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">POST delete</text>
  <text x="830" y="634" fill="#64748b" font-size="9" text-anchor="middle">删库记录 → 删 MinIO 对象</text>

  <!-- MinIO delete target -->
  <rect x="990" y="590" width="120" height="60" rx="6" fill="#f8fafc"/>
  <rect x="990" y="590" width="120" height="60" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1050" y="624" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">MinIO</text>

  <path d="M 310 620 L 380 620" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <path d="M 940 620 L 990 620" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- API to query/delete -->
  <path d="M 430 276 L 430 560 L 200 560 L 200 590" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-emerald)"/>
  <path d="M 750 276 L 750 560 L 830 560 L 830 590" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- External services -->
  <rect x="40" y="730" width="1100" height="130" rx="12" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="56" y="750" fill="#64748b" font-size="9" font-weight="600">外部依赖与 Docker Compose 基础设施（deploy/）</text>

  <!-- PostgreSQL cylinder simplified as box -->
  <rect x="80" y="770" width="180" height="62" rx="6" fill="#f8fafc"/>
  <rect x="80" y="770" width="180" height="62" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="798" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">PostgreSQL 16</text>
  <text x="170" y="816" fill="#64748b" font-size="9" text-anchor="middle">voice_manager DB · 元数据</text>

  <!-- MinIO -->
  <rect x="310" y="770" width="180" height="62" rx="6" fill="#f8fafc"/>
  <rect x="310" y="770" width="180" height="62" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="798" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">MinIO</text>
  <text x="400" y="816" fill="#64748b" font-size="9" text-anchor="middle">S3 兼容 · bucket: voices</text>

  <!-- ASR -->
  <rect x="540" y="770" width="180" height="62" rx="6" fill="#f8fafc"/>
  <rect x="540" y="770" width="180" height="62" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="630" y="798" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">ASR Service</text>
  <text x="630" y="816" fill="#64748b" font-size="9" text-anchor="middle">第三方 · ASR_URL</text>

  <!-- TTS -->
  <rect x="770" y="770" width="180" height="62" rx="6" fill="#f8fafc"/>
  <rect x="770" y="770" width="180" height="62" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="860" y="798" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">TTS Service</text>
  <text x="860" y="816" fill="#64748b" font-size="9" text-anchor="middle">第三方 · TTS_URL</text>

  <!-- voice-manager container -->
  <rect x="990" y="770" width="120" height="62" rx="6" fill="#f8fafc"/>
  <rect x="990" y="770" width="120" height="62" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="1050" y="798" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">voice-manager</text>
  <text x="1050" y="816" fill="#64748b" font-size="9" text-anchor="middle">python:3.12-slim</text>

  <!-- Links from storage to infra -->
  <path d="M 745 420 L 745 500 L 170 500 L 170 770" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow-violet)"/>
  <path d="M 535 420 L 535 500 L 400 500 L 400 770" fill="none" stroke="#7c3aed" stroke-width="1.2" stroke-opacity="0.55" marker-end="url(#arrow-violet)"/>
  <path d="M 335 420 L 335 500 L 630 500 L 630 770" fill="none" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
  <path d="M 945 420 L 945 500 L 860 500 L 860 770" fill="none" stroke="#64748b" stroke-width="1.2" stroke-opacity="0.55" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>

  <!-- Legend -->
  <rect x="860" y="30" width="290" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="875" y="50" fill="#0f172a" font-size="10" font-weight="600">图例</text>
  <rect x="875" y="62" width="14" height="14" rx="3" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1"/>
  <text x="896" y="73" fill="#64748b" font-size="8">Voice Manager 核心服务</text>
  <rect x="875" y="84" width="14" height="14" rx="3" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1"/>
  <text x="896" y="95" fill="#64748b" font-size="8">PostgreSQL / MinIO 持久化</text>
  <rect x="875" y="106" width="14" height="14" rx="3" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="896" y="117" fill="#64748b" font-size="8">外部 ASR / TTS（稳定第三方依赖）</text>
  <rect x="875" y="128" width="14" height="14" rx="3" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1"/>
  <text x="896" y="139" fill="#64748b" font-size="8">创建主路径步骤</text>
</svg>
