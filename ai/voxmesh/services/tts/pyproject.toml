[project]
name = "voxmesh-tts"
version = "0.1.0"
description = "VoxMesh CosyVoice2 TTS HTTP microservice (OpenAI-compatible API)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "sse-starlette>=2.0.0",
    "starlette>=0.36.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
