[project]
name = "voxmesh-wakeup"
version = "0.1.0"
description = "VoxMesh voice wakeup WebSocket microservice"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "funasr>=1.0.0",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.25.0",
    "pypinyin>=0.50.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
