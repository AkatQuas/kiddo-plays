[project]
name = "voxmesh"
version = "0.1.0"
description = "Composable speech-AI microservices: shared library for streaming ASR, HTTP transcription, embedding, wakeup, and TTS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["asr", "speech", "funasr", "websocket", "embedding", "tts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]

[project.urls]
Homepage = "https://github.com/your-org/voxmesh"
Documentation = "https://github.com/your-org/voxmesh/tree/main/docs"
Issues = "https://github.com/your-org/voxmesh/issues"

[tool.uv.workspace]
members = ["services/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["voxmesh", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"services/**/bootstrap.py" = ["E402"]
"services/streaming_asr/common/__init__.py" = ["E402"]
"services/streaming_asr/websocket_asr_server.py" = ["E402"]
"services/offline_asr/asr_http_server.py" = ["E402"]
"services/tts/api.py" = ["E402"]
"services/**/test*.py" = ["F401", "F841"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voxmesh*"]
