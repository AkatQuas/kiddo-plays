<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: Menlo, Monaco, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="24" y="28" fill="#0f172a" font-size="16" font-weight="700">Streaming ASR Internal Architecture</text>
  <text x="24" y="48" fill="#64748b" font-size="9">websocket_asr_server.py and model pool</text>

  <rect x="24" y="72" width="952" height="282" rx="12" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="36" y="88" fill="#059669" font-size="9" font-weight="600">streaming_asr/</text>

  <!-- connections -->
  <line x1="168" y1="140" x2="220" y2="140" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="388" y1="140" x2="440" y2="140" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="608" y1="140" x2="660" y2="140" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="828" y1="140" x2="860" y2="140" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <line x1="500" y1="160" x2="500" y2="200" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="280" y1="250" x2="280" y2="280" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="500" y1="250" x2="500" y2="280" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="720" y1="250" x2="720" y2="280" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <!-- row0 transport chain -->
  <rect x="48" y="114" width="120" height="50" rx="6" fill="#f8fafc"/>
  <rect x="48" y="114" width="120" height="50" rx="6" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="108" y="136" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">transport/</text>
  <text x="108" y="152" fill="#64748b" font-size="8" text-anchor="middle">WebSocket I/O</text>

  <rect x="220" y="114" width="168" height="50" rx="6" fill="#f8fafc"/>
  <rect x="220" y="114" width="168" height="50" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="304" y="136" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">PooledRealtimeASR</text>
  <text x="304" y="152" fill="#64748b" font-size="8" text-anchor="middle">service/</text>

  <rect x="440" y="114" width="168" height="50" rx="6" fill="#f8fafc"/>
  <rect x="440" y="114" width="168" height="50" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="524" y="136" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">model_pool</text>
  <text x="524" y="152" fill="#64748b" font-size="8" text-anchor="middle">acquire / release</text>

  <rect x="660" y="114" width="168" height="50" rx="6" fill="#f8fafc"/>
  <rect x="660" y="114" width="168" height="50" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="744" y="136" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">ASR backends</text>
  <text x="744" y="152" fill="#64748b" font-size="8" text-anchor="middle">SenseVoice / Whisper</text>

  <rect x="860" y="114" width="100" height="50" rx="6" fill="#f8fafc"/>
  <rect x="860" y="114" width="100" height="50" rx="6" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1.5"/>
  <text x="910" y="136" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Client</text>
  <text x="910" y="152" fill="#64748b" font-size="8" text-anchor="middle">WS :36005</text>

  <!-- model pool row -->
  <rect x="200" y="200" width="600" height="50" rx="6" fill="#f8fafc"/>
  <rect x="200" y="200" width="600" height="50" rx="6" fill="rgba(234,88,12,0.12)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="500" y="222" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Shared model pools (per GPU)</text>
  <text x="500" y="238" fill="#64748b" font-size="9" text-anchor="middle">Detector pool | ASR pool | Speaker pool</text>

  <!-- pool children -->
  <rect x="180" y="280" width="200" height="50" rx="6" fill="#f8fafc"/>
  <rect x="180" y="280" width="200" height="50" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="280" y="302" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">speech/ VAD</text>
  <text x="280" y="318" fill="#64748b" font-size="8" text-anchor="middle">voice activity</text>

  <rect x="400" y="280" width="200" height="50" rx="6" fill="#f8fafc"/>
  <rect x="400" y="280" width="200" height="50" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="302" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">speaker/</text>
  <text x="500" y="318" fill="#64748b" font-size="8" text-anchor="middle">embedding + clustering</text>

  <rect x="620" y="280" width="200" height="50" rx="6" fill="#f8fafc"/>
  <rect x="620" y="280" width="200" height="50" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5"/>
  <text x="720" y="302" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">advice/ + pipeline/</text>
  <text x="720" y="318" fill="#64748b" font-size="8" text-anchor="middle">LLM + session state</text>

  <rect x="24" y="370" width="952" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="393" fill="#334155" font-size="9">init acquires pool handles; disconnect saves session via pipeline/speaker_state</text>
</svg>
