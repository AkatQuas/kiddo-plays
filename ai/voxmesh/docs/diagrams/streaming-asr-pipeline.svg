<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 780">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-emerald" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <style>
      text { font-family: Menlo, Monaco, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="24" y="28" fill="#0f172a" font-size="16" font-weight="700">Streaming ASR Recognition Pipeline</text>
  <text x="24" y="48" fill="#64748b" font-size="9">Per-client flow inside PooledRealtimeSpeechRecognizer</text>

  <!-- connections -->
  <line x1="260" y1="110" x2="260" y2="132" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="260" y1="182" x2="260" y2="204" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="260" y1="292" x2="260" y2="314" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="260" y1="364" x2="260" y2="386" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="260" y1="436" x2="260" y2="458" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="260" y1="508" x2="260" y2="530" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="260" y1="580" x2="260" y2="602" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <line x1="260" y1="652" x2="260" y2="674" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>

  <!-- no branch -->
  <line x1="260" y1="254" x2="260" y2="314" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="300" y="248" fill="#64748b" font-size="8">no speech: wait</text>

  <!-- nodes -->
  <rect x="130" y="60" width="260" height="50" rx="25" fill="#f8fafc"/>
  <rect x="130" y="60" width="260" height="50" rx="25" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="260" y="90" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">PCM audio chunks (16kHz)</text>

  <rect x="130" y="132" width="260" height="50" rx="6" fill="#f8fafc"/>
  <rect x="130" y="132" width="260" height="50" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="260" y="154" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">VAD / Speech detector</text>
  <text x="260" y="170" fill="#64748b" font-size="9" text-anchor="middle">segment boundaries</text>

  <g transform="translate(260, 228)">
    <polygon points="0,-38 70,0 0,38 -70,0" fill="#f8fafc"/>
    <polygon points="0,-38 70,0 0,38 -70,0" fill="rgba(217,119,6,0.12)" stroke="#d97706" stroke-width="1.5"/>
    <text y="-2" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Speech?</text>
  </g>

  <rect x="130" y="314" width="260" height="50" rx="6" fill="#f8fafc"/>
  <rect x="130" y="314" width="260" height="50" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="260" y="336" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Streaming ASR model</text>
  <text x="260" y="352" fill="#64748b" font-size="9" text-anchor="middle">begin / changed / end</text>

  <rect x="130" y="386" width="260" height="50" rx="6" fill="#f8fafc"/>
  <rect x="130" y="386" width="260" height="50" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="260" y="408" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Speaker clustering</text>
  <text x="260" y="424" fill="#64748b" font-size="9" text-anchor="middle">optional diarization</text>

  <rect x="130" y="458" width="260" height="50" rx="6" fill="#f8fafc"/>
  <rect x="130" y="458" width="260" height="50" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="260" y="480" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">LLM text correction</text>
  <text x="260" y="496" fill="#64748b" font-size="9" text-anchor="middle">optional, on end</text>

  <rect x="130" y="530" width="260" height="50" rx="6" fill="#f8fafc"/>
  <rect x="130" y="530" width="260" height="50" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="260" y="552" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Streaming advice</text>
  <text x="260" y="568" fill="#64748b" font-size="9" text-anchor="middle">optional LLM hints</text>

  <rect x="130" y="602" width="260" height="50" rx="6" fill="#f8fafc"/>
  <rect x="130" y="602" width="260" height="50" rx="6" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="260" y="624" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">WebSocket recognition_result</text>
  <text x="260" y="640" fill="#64748b" font-size="9" text-anchor="middle">push to client</text>

  <rect x="130" y="674" width="260" height="50" rx="25" fill="#f8fafc"/>
  <rect x="130" y="674" width="260" height="50" rx="25" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="260" y="704" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">Session save on disconnect</text>

  <rect x="24" y="744" width="472" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="767" fill="#334155" font-size="9">Dashed boxes = optional features from config.json</text>
</svg>
