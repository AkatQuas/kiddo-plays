<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-open" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: Menlo, Monaco, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="24" y="28" fill="#0f172a" font-size="16" font-weight="700">Streaming Advice Sequence</text>
  <text x="24" y="48" fill="#64748b" font-size="9">Optional LLM suggestions after finalized transcript</text>

  <!-- lifelines -->
  <line x1="120" y1="100" x2="120" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="320" y1="100" x2="320" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="520" y1="100" x2="520" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="720" y1="100" x2="720" y2="300" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- actors -->
  <rect x="48" y="72" width="144" height="40" rx="6" fill="#f8fafc"/>
  <rect x="48" y="72" width="144" height="40" rx="6" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="120" y="95" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Client</text>

  <rect x="248" y="72" width="144" height="40" rx="6" fill="#f8fafc"/>
  <rect x="248" y="72" width="144" height="40" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="320" y="95" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">StreamingAdvice</text>

  <rect x="448" y="72" width="144" height="40" rx="6" fill="#f8fafc"/>
  <rect x="448" y="72" width="144" height="40" rx="6" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="520" y="95" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">summary_title</text>

  <rect x="648" y="72" width="144" height="40" rx="6" fill="#f8fafc"/>
  <rect x="648" y="72" width="144" height="40" rx="6" fill="rgba(100,116,139,0.12)" stroke="#64748b" stroke-width="1.5"/>
  <text x="720" y="95" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Ollama LLM</text>

  <!-- messages -->
  <line x1="120" y1="140" x2="320" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="134" fill="#334155" font-size="8" text-anchor="middle" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill">final segment text</text>

  <line x1="320" y1="175" x2="520" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="169" fill="#334155" font-size="8" text-anchor="middle" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill">summarize + decide advice</text>

  <line x1="520" y1="210" x2="720" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="204" fill="#334155" font-size="8" text-anchor="middle" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill">chat completion</text>

  <line x1="720" y1="245" x2="520" y2="245" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
  <text x="620" y="239" fill="#334155" font-size="8" text-anchor="middle" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill">JSON advice payload</text>

  <line x1="520" y1="275" x2="120" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="269" fill="#334155" font-size="8" text-anchor="middle" stroke="#f8fafc" stroke-width="3" paint-order="stroke fill">type: advice over WebSocket</text>

  <rect x="24" y="328" width="772" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="351" fill="#334155" font-size="9">Gated by enable_advice in config.json; deduped against recent titles</text>
</svg>
