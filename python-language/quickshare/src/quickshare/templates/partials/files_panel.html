<div class="upload-area mb-4" id="uploadArea">
  <div class="d-flex flex-column flex-md-row align-items-center gap-3 p-3">
    <div class="d-flex align-items-center gap-3 flex-grow-1">
      <i class="bi bi-cloud-upload fs-1 text-muted"></i>
      <div>
        <div>拖拽文件到此处，或点击选择</div>
        <div class="text-muted small">单个文件最大 {{ max_upload_mb }}MB</div>
        <button class="btn btn-outline-primary btn-sm mt-2" type="button" data-action="pick-files">
          <i class="bi bi-folder"></i> 选择文件
        </button>
      </div>
    </div>
    <div class="upload-category">
      <div class="input-group input-group-sm">
        <span class="input-group-text"><i class="bi bi-tags"></i></span>
        <select class="form-select" id="uploadCategory" aria-label="上传分类">
          <option value="未分类">未分类</option>
        </select>
        <button class="btn btn-outline-secondary" type="button" data-action="show-categories" title="分类管理" aria-label="分类管理">
          <i class="bi bi-gear"></i>
        </button>
      </div>
    </div>
    <input type="file" id="fileInput" multiple hidden />
  </div>
</div>

<div class="row g-2 align-items-center mb-3">
  <div class="col-md-4">
    <div class="input-group input-group-sm">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input
        type="search"
        class="form-control"
        id="fileSearchInput"
        placeholder="搜索文件名..."
        aria-label="搜索文件名"
      />
      <button
        class="btn btn-outline-secondary"
        type="button"
        data-action="clear-file-search"
        aria-label="清除搜索"
      >
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>
  <div class="col-md-3">
    <select
      class="form-select form-select-sm"
      id="categoryFilter"
      aria-label="按分类筛选"
    >
      <option value="">所有分类</option>
      <option value="未分类">未分类</option>
    </select>
  </div>
  <div class="col-md-5 d-flex justify-content-md-end gap-2">
    <button
      class="btn btn-outline-secondary btn-sm"
      type="button"
      data-action="refresh-files"
    >
      刷新
    </button>
    <button
      class="btn btn-outline-danger btn-sm"
      type="button"
      data-action="clear-files"
    >
      删除全部
    </button>
    <button
      class="btn btn-outline-secondary btn-sm"
      type="button"
      data-action="checksum-all"
    >
      计算 MD5
    </button>
  </div>
</div>

<div class="row row-cols-1 row-cols-md-2 g-3" id="fileList">
  {% if files %} {% for file in files %}
  <div class="col file-item">
    <div class="card h-100">
      <div class="card-body file-card-body d-flex align-items-start gap-3">
        <div class="file-card-info">
          <div class="file-name fw-medium">{{ file.original_name }}</div>
          <div class="text-muted small mt-2">
            {{ file.size_human }}
            <span class="mx-1">·</span>
            {{ file.modified }}
          </div>
          <div class="mt-2 d-flex align-items-center gap-1">
            <span class="badge bg-secondary">{{ file.category }}</span>
            <button class="icon-btn" type="button" data-action="change-category" data-file-name="{{ file.name }}" data-file-category="{{ file.category }}" aria-label="修改分类" title="修改分类">
              <i class="bi bi-pencil"></i>
            </button>
          </div>
          <div class="file-md5 small mt-2 d-flex align-items-center gap-1">
            {% if file.md5 %}
            <span class="text-muted">MD5</span>
            <code>{{ file.md5 }}</code>
            <button class="icon-btn" type="button" data-action="copy-md5" data-md5="{{ file.md5 }}" aria-label="复制" title="复制">
              <i class="bi bi-clipboard"></i>
            </button>
            {% else %}
            <span class="text-muted">MD5 未计算</span>
            <button class="icon-btn" type="button" data-action="checksum-file" data-file-name="{{ file.name }}" aria-label="计算" title="计算">
              <i class="bi bi-calculator"></i>
            </button>
            {% endif %}
          </div>
        </div>
        <div class="file-card-actions d-flex flex-column gap-2">
          <a class="btn btn-outline-primary btn-sm" href="{{ url_for('download_file', filename=file.name) }}" aria-label="下载" title="下载">
            <i class="bi bi-download"></i>
          </a>
          <button class="btn btn-outline-danger btn-sm" type="button" data-action="delete-file" data-file-name="{{ file.name }}" aria-label="删除" title="删除">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  {% endfor %} {% else %}
  <div class="col-12 list-empty text-center text-muted py-4">
    <i class="bi bi-folder-x display-4"></i>
    <h6 class="mt-3">暂无文件</h6>
  </div>
  {% endif %}
</div>
