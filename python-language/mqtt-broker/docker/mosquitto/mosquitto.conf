# Mosquitto MQTT Broker configuration.
#
# NOTE: This is a DEMO config for local development only.
# allow_anonymous true means anyone on the network can connect. For any real /
# production use you MUST enable authentication (see the password_file / user
# sections, commented out at the bottom).

# The port the broker listens on (inside the container).
# Mapped to the host by docker-compose via 1883:1883.
listener 1883

# Allow clients to connect without a username/password.
allow_anonymous true

# Places to log to. console so `docker compose logs -f` shows activity.
log_dest stdout
log_type all
log_timestamp true

# Keep-alive and max client limits (optional, sensible defaults shown).
max_keepalive 60

# ---------------------------------------------------------------------------
# PRODUCTION NOTE -----------------------------------------------------------
# To secure this broker instead of allowing anonymous access:
#
#   1. persist = true
#   2. password_file /mosquitto/config/passwd
#   3. Create the password file:
#        docker compose exec mosquitto mosquitto_passwd -c \
#          /mosquitto/config/passwd myuser
#   4. Set allow_anonymous false
#   5. Update src/config.py with MQTT_USERNAME / MQTT_PASSWORD
# ---------------------------------------------------------------------------